spring:
  application:
    name: ucms-backend
  datasource:
    url: jdbc:postgresql://db.[YOUR-PROJECT-REF].supabase.co:5432/postgres
    username: postgres
    password: [YOUR-PASSWORD]
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
